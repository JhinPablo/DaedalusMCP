name: Staging
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
permissions:
  contents: read
  actions: read
  pull-requests: write
concurrency:
  group: daedalus-staging
  cancel-in-progress: false
jobs:
  deploy:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_repository.full_name == github.repository && github.event.workflow_run.head_branch == 'staging'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npx tsx scripts/deploy-ci.ts staging
        env:
          GH_TOKEN: ${{ github.token }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          DAEDALUS_CI_TOKEN: ${{ secrets.DAEDALUS_CI_TOKEN }}
          STAGING_DAEDALUS_CI_TOKEN: ${{ secrets.STAGING_DAEDALUS_CI_TOKEN }}
          STAGING_ACCESS_CLIENT_ID: ${{ secrets.STAGING_ACCESS_CLIENT_ID }}
          STAGING_ACCESS_CLIENT_SECRET: ${{ secrets.STAGING_ACCESS_CLIENT_SECRET }}
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
          DAEDALUS_URL: ${{ vars.DAEDALUS_URL }}
          STAGING_URL: ${{ vars.STAGING_URL }}
          ACCESS_TEAM_DOMAIN: ${{ vars.ACCESS_TEAM_DOMAIN }}
          STAGING_ACCESS_AUD: ${{ vars.STAGING_ACCESS_AUD }}
          OWNER_EMAIL: ${{ secrets.OWNER_EMAIL }}
          DAEDALUS_SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
          DAEDALUS_CI_RUN_ID: ${{ github.event.workflow_run.id }}
