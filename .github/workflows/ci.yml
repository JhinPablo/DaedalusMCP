name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
        env:
          DAEDALUS_BUILD_ID: ${{ github.event.pull_request.head.sha || github.sha }}
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test
      - name: Record artifact identity
        run: node -e 'require("fs").writeFileSync("dist/build-info.json",JSON.stringify({commit:process.env.SOURCE_SHA}))'
        env:
          SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/upload-artifact@v4
        with:
          name: build
          path: |
            dist/client
            dist/worker
            dist/build-info.json
          retention-days: 30
