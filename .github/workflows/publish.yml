name: Publish
run-name: publish-${{ inputs.release_id }}
on:
  workflow_dispatch:
    inputs:
      release_id:
        required: true
        type: string
      control_environment:
        type: choice
        default: production
        options: [production, staging]
permissions:
  contents: write
  pull-requests: write
  actions: read
  checks: read
  statuses: read
concurrency:
  group: daedalus-production
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npx tsx scripts/deploy-ci.ts production
        env:
          GH_TOKEN: ${{ github.token }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          DAEDALUS_CI_TOKEN: ${{ inputs.control_environment == 'staging' && secrets.STAGING_DAEDALUS_CI_TOKEN || secrets.DAEDALUS_CI_TOKEN }}
          CF_ACCESS_CLIENT_ID: ${{ inputs.control_environment == 'staging' && secrets.STAGING_ACCESS_CLIENT_ID || secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ inputs.control_environment == 'staging' && secrets.STAGING_ACCESS_CLIENT_SECRET || secrets.CF_ACCESS_CLIENT_SECRET }}
          DAEDALUS_URL: ${{ inputs.control_environment == 'staging' && vars.STAGING_URL || vars.DAEDALUS_URL }}
          STAGING_URL: ${{ vars.STAGING_URL }}
          PRODUCTION_URL: ${{ vars.DAEDALUS_URL }}
          PRODUCTION_DAEDALUS_CI_TOKEN: ${{ secrets.DAEDALUS_CI_TOKEN }}
          PRODUCTION_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          PRODUCTION_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
          ACCESS_TEAM_DOMAIN: ${{ vars.ACCESS_TEAM_DOMAIN }}
          PRODUCTION_ACCESS_AUD: ${{ vars.PRODUCTION_ACCESS_AUD }}
          OWNER_EMAIL: ${{ secrets.OWNER_EMAIL }}
          DAEDALUS_RELEASE_ID: ${{ inputs.release_id }}
